{% extends "base.html" %}
{% block content %}
<h1>{{ values.title }}</h1>
<dl>
  <dt>Website URL</dt><dd>{{ values.website_url }}</dd>
  <dt>Username</dt><dd>{{ values.username }}</dd>
  <dt>Notes</dt><dd class="notes">{{ values.notes or 'No notes.' }}</dd>
</dl>
<details>
  <summary>Show saved password</summary>
  <pre class="secret">{{ values.password }}</pre>
</details>
<p><a class="button" href="{{ url_for('vault.edit_entry', entry_id=entry_id) }}">Edit entry</a></p>
<form method="post" action="{{ url_for('vault.delete_entry', entry_id=entry_id) }}" class="delete-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="check"><input type="checkbox" name="confirm_delete" value="yes" required>
    I want to permanently delete this entry.</label>
  <button class="danger" type="submit">Delete entry</button>
</form>
{% endblock %}
